 
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'XKBSIR-2-main.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          unzip -q XKBSIR-2-main.zip -d extracted
          test -f extracted/XKBSIR-2-main/app/build.gradle.kts

      - name: Fix Android SDK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/XKBSIR-2-main/app/build.gradle.kts")
          s = p.read_text()
          old = "compileSdk { version = release(36) { minorApiLevel = 1 } }"
          if old not in s:
              raise SystemExit("Expected compileSdk setting not found")
          p.write_text(s.replace(old, "compileSdk = 36"))
          PY

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Create debug signing key
        working-directory: extracted/XKBSIR-2-main
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 -noprompt

      - name: Build APK
        working-directory: extracted/XKBSIR-2-main
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XKBSIR-APK
          path: extracted/XKBSIR-2-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
