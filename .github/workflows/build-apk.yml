
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Extract ZIP
        run: unzip -q XKBSIR-2-main.zip -d extracted

      - name: Build APK
        working-directory: extracted/XKBSIR-2-main
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: XKBSIR-APK
          path: extracted/XKBSIR-2-main/app/build/outputs/apk/debug/*.apk
          
